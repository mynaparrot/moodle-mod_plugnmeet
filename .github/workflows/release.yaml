name: Upload as release asset and submit to Moodle Marketplace
on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-mod:
    runs-on: ubuntu-latest
    env:
      PLUGIN: mod_plugnmeet
      ENDPOINT: https://marketplace.moodle.com/api
      TOKEN: ${{ secrets.MOODLE_MARKETPLACE_TOKEN }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Checkout code
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/checkout@v6
      - name: Build project
        if: ${{ steps.release.outputs.release_created }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p build/plugnmeet
          # Exclude git files, github workflows, and build directory
          rsync -ar --exclude=".*" --exclude="/build" --exclude="/tests" ./ build/plugnmeet/
          cd build
          zip -X -r mod_plugnmeet.zip plugnmeet
          gh release upload ${{ steps.release.outputs.tag_name }} mod_plugnmeet.zip
      - name: Submit version to Moodle Marketplace
        if: ${{ steps.release.outputs.release_created }}
        id: add-version
        env:
          TAGNAME: ${{ steps.release.outputs.tag_name }}
        run: |
          HTTP_STATUS=$(curl -sS -o response.json -w "%{http_code}" \
            -X POST "${ENDPOINT}/plugins/${PLUGIN}/versions" \
            -H "Authorization: Bearer ${TOKEN}" \
            -F "file=@build/mod_plugnmeet.zip" \
            --form-string "vcsRepositoryUrl=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --form-string "vcsBranch=${GITHUB_REF_NAME}" \
            --form-string "vcsTag=${TAGNAME}")

          echo "Response status: ${HTTP_STATUS}"
          jq . response.json 2>/dev/null || cat response.json

          if [ "${HTTP_STATUS}" -ne 201 ]; then
            echo "::error::Moodle Marketplace API returned ${HTTP_STATUS}"
            if jq -e '.violations' response.json > /dev/null 2>&1; then
              jq '.violations' response.json
            fi
            exit 1
          fi

          jq --exit-status ".id" response.json > /dev/null
